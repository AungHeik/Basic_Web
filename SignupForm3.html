<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>
    <div class="container mt-5">'
        <div class="row justify-content-center">
            <div class="col-12 col-lg-4">
                <div class="card">
                    <div class="card-header bg-info text-white text-center">
                        <h5 class="mb-0">Signup Form</h5>
                    </div>
                    <div class="card-body py-3 px-3">
                        <form>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="bi bi-envelope-at"></i></span>
                                <div class="form-floating">
                                    <input type="email" id="email" name="email" placeholder="" class="form-control">
                                    <label for="email" class="form-label">Enter your email</label>
                                </div>
                                <span class="input-group-text">@gmail.com</span>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="bi bi-person-circle"></i></span>
                                <div class="form-floating">
                                    <input type="text" id="username" name="username" placeholder=""
                                        class="form-control">
                                    <label for="username" class="form-label">Enter your username</label>
                                </div>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="bi bi-person-lock"></i></span>
                                <div class="form-floating">
                                    <input type="password" id="password" name="password" placeholder=""
                                        class="form-control">
                                    <label for="password" class="form-label">Enter your password</label>
                                </div>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="bi bi-person-fill-lock"></i></span>
                                <div class="form-floating">
                                    <input type="password" id="confirm-password" name="confirm-password" placeholder=""
                                        class="form-control">
                                    <label for="confirm-password" class="form-label">Confirm your password</label>
                                </div>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <div class="form-floating">
                                    <input type="text" id="mobile" name="mobile" placeholder="" class="form-control">
                                    <label for="mobile" class="form-label">Enter your mobile</label>
                                </div>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="bi bi-house"></i></span>
                                <div class="form-floating">
                                    <textarea id="address" name="address" placeholder=""
                                        class="form-control"></textarea>
                                    <label for="address" class="form-label">Enter your address</label>
                                </div>
                            </div>
                            <!--Signup Button-->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Singup</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>



</body>

</html>
